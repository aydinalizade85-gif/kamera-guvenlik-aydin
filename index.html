<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamera Güvənlik Aydın</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;text-align:center;color:#111}
.brand{position:fixed;top:12px;right:12px;font-size:13px;font-weight:700;z-index:5}
.wrap{padding:85px 20px 30px}.logo{font-size:23px;font-weight:800;margin-bottom:42px}
.step{display:none}.step.active{display:block}
button{display:block;width:100%;max-width:360px;margin:18px auto;padding:16px;border:0;border-radius:10px;font-size:18px;background:#e9e9e9}
button:active{background:#d6d6d6}#camera{display:none}.status{margin-top:22px}
</style>
</head>
<body>
<div class="brand">Kamera Güvənlik Aydın</div>
<div class="wrap">
  <div class="logo">Kamera Güvənlik Aydın</div>

  <section id="s1" class="step active">
    <h2>Photo &amp; Location Sharing</h2>
    <p>I agree to share my photo and location.</p>
    <button onclick="agree()">I Agree</button>
  </section>

  <section id="s2" class="step">
    <h2>Step 1</h2>
    <p>Please take a photo.</p>
    <button onclick="document.getElementById('camera').click()">📷 Take a Photo</button>
  </section>

  <section id="s3" class="step">
    <h2>Step 2</h2>
    <p>Please allow location access.</p>
  </section>

  <section id="s4" class="step">
    <h2>Completed</h2>
    <p>Your photo and location have been submitted.</p>
  </section>

  <input id="camera" type="file" accept="image/*" capture="environment">
  <div id="status" class="status"></div>
</div>

<script>
/* AFTER DEPLOYING Code.gs, paste the Web App URL between the quotes below. */
const SERVER_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
let photoData = null;

function show(id){
  document.querySelectorAll(".step").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function agree(){ show("s2"); }

document.getElementById("camera").addEventListener("change", function(e){
  const file=e.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=function(ev){
    photoData=ev.target.result;
    show("s3");
    requestLocation();
  };
  r.readAsDataURL(file);
});

function requestLocation(){
  if(!navigator.geolocation){
    document.getElementById("status").textContent="This browser does not support location.";
    return;
  }
  navigator.geolocation.getCurrentPosition(
    p=>{
      const lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy;
      sendData(lat,lon,acc);
    },
    ()=>{
      document.getElementById("status").textContent=
        "Location permission was denied. Please allow location access and try again.";
    },
    {enableHighAccuracy:true,timeout:20000,maximumAge:0}
  );
}

function sendData(lat,lon,accuracy){
  if(SERVER_URL.includes("PASTE_YOUR_")){
    document.getElementById("status").textContent=
      "Location was received, but the server is not connected yet.";
    show("s4"); return;
  }
  fetch(SERVER_URL,{
    method:"POST", mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({
      photo:photoData, latitude:lat, longitude:lon, accuracy:accuracy,
      mapsUrl:"https://www.google.com/maps?q="+lat+","+lon
    })
  }).then(()=>{
    show("s4");
    document.getElementById("status").textContent="Photo and location sent successfully.";
  }).catch(()=>{
    document.getElementById("status").textContent="Sending failed.";
  });
}
</script>
</body>
</html>
